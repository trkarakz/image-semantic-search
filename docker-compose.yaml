services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: image-search-postgres

    environment:
      POSTGRES_DB: images
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d images" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: